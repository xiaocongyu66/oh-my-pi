# Fork-only standalone binary builder. The upstream release chain needs the
# can1357 kata runner pool (bazel cross builds) and a version tag, neither of
# which a fork has. This workflow embeds the published prebuilt native addons
# (@oh-my-pi/pi-natives-<target>, version-matched to packages/natives) instead
# of building them, so `bun --compile` cross-targets run on a plain hosted
# runner and the result downloads straight from the run's artifacts.
name: Fork binary build

on:
   workflow_dispatch:
      inputs:
         targets:
            description: "Comma-separated targets (linux-arm64, darwin-arm64, win32-arm64)"
            required: false
            default: "linux-arm64,darwin-arm64,win32-arm64"
   push:
      branches: [main]

concurrency:
   group: fork-binaries-${{ github.ref }}
   cancel-in-progress: true

permissions:
   contents: read

jobs:
   build:
      name: Build omp binaries (${{ github.event.inputs.targets || 'linux-arm64, darwin-arm64, win32-arm64' }})
      runs-on: ubuntu-22.04
      timeout-minutes: 40
      env:
         TARGETS: ${{ github.event.inputs.targets || 'linux-arm64,darwin-arm64,win32-arm64' }}
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - name: Fetch prebuilt native addons from npm
           shell: bash
           run: |
              set -euo pipefail
              ver="$(bun -e 'console.log(require("./packages/natives/package.json").version)')"
              IFS=',' read -ra list <<< "$TARGETS"
              for t in "${list[@]}"; do
                 t="$(echo "$t" | tr -d ' ')"
                 case "$t" in
                    linux-arm64|darwin-arm64|win32-arm64) leaf="$t" ;;
                    *) echo "::error::no prebuilt pi-natives leaf published for target '$t'"; exit 1 ;;
                 esac
                 url="https://registry.npmjs.org/@oh-my-pi%2Fpi-natives-$leaf/-/pi-natives-$leaf-$ver.tgz"
                 curl -fsSL "$url" -o "/tmp/pi-natives-$leaf.tgz"
                 rm -rf /tmp/pi-natives-$leaf && mkdir -p /tmp/pi-natives-$leaf
                 tar xzf "/tmp/pi-natives-$leaf.tgz" -C "/tmp/pi-natives-$leaf"
                 cp "/tmp/pi-natives-$leaf/package/pi_natives.$leaf.node" packages/natives/native/
              done
              ls -la packages/natives/native/*.node
         - name: Compile standalone binaries
           run: bun scripts/ci-release-build-binaries.ts --targets="$TARGETS"
         - name: Record checksums
           shell: bash
           run: |
              set -euo pipefail
              cd packages/coding-agent/binaries
              sha256sum omp-* > SHA256SUMS
              cat SHA256SUMS
         - uses: actions/upload-artifact@v4
           with:
              name: omp-binaries-${{ github.sha }}
              path: packages/coding-agent/binaries/*
              if-no-files-found: error
